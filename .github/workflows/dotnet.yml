name: Backend verification

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: piya_test
          POSTGRES_PASSWORD: piya_test_pw
          POSTGRES_DB: piya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piya_test -d piya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: LoadTest
      ENABLE_DEMO_SEEDING: "false"
      EFCORE_IGNORE_PENDING_MODEL_CHANGES: "true"
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=piya_test;Username=piya_test;Password=piya_test_pw"
      ConnectionStrings__Redis: "localhost:6379,abortConnect=false"
      Caching__Provider: Redis
      Caching__RedisConnectionString: "localhost:6379,abortConnect=false"
      Jwt__SecretKey: "CI_TEST_JWT_SECRET_KEY_THAT_IS_AT_LEAST_64_CHARS_LONG_FOR_TESTING_PURPOSES_ONLY"
      Jwt__Issuer: PIYA_API_TEST
      Jwt__Audience: PIYA_Clients_TEST
      Security__QrSigningKey: "CI_TEST_QR_SIGNING_KEY_THAT_IS_AT_LEAST_64_CHARS_FOR_TESTING_PURPOSES"
      Security__PrescriptionSigningKey: "CI_TEST_RX_SIGNING_KEY_THAT_IS_AT_LEAST_64_CHARS_FOR_TESTING_PURPOSES"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      SuperAdmin__Username: ci-admin
      SuperAdmin__Email: "admin@test.piya.life"
      SuperAdmin__Password: "TestAdmin123!@#"
      SuperAdmin__FirstName: Test
      SuperAdmin__LastName: Admin
      SuperAdmin__Phone: "+994501234567"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore PIYA_API.sln

      - name: Build
        run: dotnet build PIYA_API.sln --configuration Release --no-restore

      - name: Reject model changes without a migration
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project PIYA_API/PIYA_API.csproj
          --startup-project PIYA_API/PIYA_API.csproj
          --no-build
          --configuration Release

      - name: Apply migrations to a clean database
        run: >-
          dotnet ef database update
          --project PIYA_API/PIYA_API.csproj
          --startup-project PIYA_API/PIYA_API.csproj
          --no-build
          --configuration Release

      - name: Run unit, integration, and security tests
        run: >-
          dotnet test PIYA_API.Tests/PIYA_API.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category!=LoadTest"
          --logger "trx;LogFileName=test-results.trx"

      - name: Audit NuGet dependencies
        run: |
          dotnet list PIYA_API.sln package --vulnerable --include-transitive --format json | tee /tmp/piya-nuget-audit.json
          if grep -q '"severity"' /tmp/piya-nuget-audit.json; then
            echo "Vulnerable NuGet dependency detected." >&2
            exit 1
          fi

      - name: Smoke-test OpenAPI generation
        env:
          ASPNETCORE_ENVIRONMENT: OpenApi
          PIYA_GENERATE_OPENAPI: "true"
          DataProtection__KeyPath: /tmp/piya-contract-keys
        run: |
          dotnet swagger tofile --output /tmp/piya-api-v1.json PIYA_API/bin/Release/net9.0/PIYA_API.dll v1
          python3 - <<'PY'
          import json
          with open("/tmp/piya-api-v1.json", encoding="utf-8") as spec_file:
              spec = json.load(spec_file)
          assert spec["openapi"].startswith("3.")
          assert spec["paths"], "OpenAPI document contains no paths"
          PY

      - name: Publish API
        run: dotnet publish PIYA_API/PIYA_API.csproj --configuration Release --no-build --output artifacts/api

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            artifacts/api
            PIYA_API.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

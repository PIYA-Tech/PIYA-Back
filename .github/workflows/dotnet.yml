# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Start a Postgres service so tests that use the DB can run in CI
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: piya
          POSTGRES_PASSWORD: piya
          POSTGRES_DB: piya_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piya -d piya_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && break
            echo "Waiting for Postgres... ($i)"
            sleep 2
          done

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Install dotnet-ef CLI
        run: |
          dotnet tool install --global dotnet-ef --version 9.* || dotnet tool update --global dotnet-ef --version 9.*
          export PATH="$PATH:$HOME/.dotnet/tools"

      - name: Apply EF Core migrations
        env:
          ASPNETCORE_ENVIRONMENT: LoadTest
          EFCORE_IGNORE_PENDING_MODEL_CHANGES: "true"
          ConnectionStrings__DefaultConnection: Host=localhost;Database=piya_db;Username=piya;Password=piya;Pooling=true;MaxPoolSize=50;Timeout=30
          Jwt__SecretKey: CI_TEST_SECRET_KEY_32_CHARS_MINIMUM__1234
          Jwt__Issuer: PIYA_API_CI
          Jwt__Audience: PIYA_Clients_CI
          Security__QrSigningKey: CI_QR_SIGNING_KEY_32_CHARS_MINIMUM__1234
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project PIYA_API/PIYA_API.csproj --startup-project PIYA_API/PIYA_API.csproj

      - name: Start API (background)
        env:
          ASPNETCORE_ENVIRONMENT: LoadTest
          EFCORE_IGNORE_PENDING_MODEL_CHANGES: "true"
          ConnectionStrings__DefaultConnection: Host=localhost;Database=piya_db;Username=piya;Password=piya;Pooling=true;MaxPoolSize=50;Timeout=30
          Jwt__SecretKey: CI_TEST_SECRET_KEY_32_CHARS_MINIMUM__1234
          Jwt__Issuer: PIYA_API_CI
          Jwt__Audience: PIYA_Clients_CI
          Security__QrSigningKey: CI_QR_SIGNING_KEY_32_CHARS_MINIMUM__1234
        run: |
          dotnet run --project PIYA_API/PIYA_API.csproj --urls http://localhost:5254 &
          echo $! > api_pid
          # wait for health endpoint
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:5254/api/health >/dev/null; then
              echo "API healthy"
              break
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done

      - name: Run tests (exclude LoadTest)
        env:
          ASPNETCORE_ENVIRONMENT: LoadTest
          EFCORE_IGNORE_PENDING_MODEL_CHANGES: "true"
          ConnectionStrings__DefaultConnection: Host=localhost;Database=piya_db;Username=piya;Password=piya;Pooling=true;MaxPoolSize=50;Timeout=30
          Jwt__SecretKey: CI_TEST_SECRET_KEY_32_CHARS_MINIMUM__1234
          Jwt__Issuer: PIYA_API_CI
          Jwt__Audience: PIYA_Clients_CI
          Security__QrSigningKey: CI_QR_SIGNING_KEY_32_CHARS_MINIMUM__1234
        run: |
          # Run test project directly and match the build configuration (Release).
          # This avoids VSTest/solution-level issues where msbuild may try to
          # run tests in a different configuration (Debug) and fail with an
          # invalid argument to vstest.console.
          dotnet test PIYA_API.Tests/PIYA_API.Tests.csproj \
            --no-build --configuration Release --verbosity normal \
            --filter "Category!=LoadTest"

      - name: Stop API
        if: always()
        run: |
          if [ -f api_pid ]; then
            kill $(cat api_pid) || true
          fi
